name: Deploy training to Hostinger (FTPS)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: training-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP and inspect FTP certificate
        shell: bash
        run: |
          set -euo pipefail
          php -l api.php
          timeout 30 openssl s_client -starttls ftp -connect 147.93.92.210:21 -showcerts </dev/null > /tmp/ftp-cert.txt 2>/tmp/ftp-tls.log
          openssl x509 -in /tmp/ftp-cert.txt -noout -subject -issuer -dates -ext subjectAltName -fingerprint -sha256
      - name: Deploy with verified explicit FTPS
        env:
          FTP_HOST: 'server2057.hstgr.io'
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FTP_HOST:?Missing FTP certificate hostname}"
          : "${FTP_USERNAME:?Add FTP_USERNAME}"
          : "${FTP_PASSWORD:?Add FTP_PASSWORD}"
          # Verify the certificate before sending any account credentials.
          timeout 30 openssl s_client -starttls ftp -connect 147.93.92.210:21 -servername "$FTP_HOST" -verify_hostname "$FTP_HOST" -verify_return_error </dev/null >/dev/null
          # Account may be jailed directly inside the site's document root.
          opts=(--silent --show-error --fail --ssl-reqd --resolve "$FTP_HOST:21:147.93.92.210" --connect-timeout 25 --max-time 90 --ftp-pasv --user "$FTP_USERNAME:$FTP_PASSWORD")
          base="ftp://$FTP_HOST:21"
          # Verify existing application files against the live site's public files.
          # Never read config.php or database files.
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          curl --silent --show-error --fail --location --max-time 30 https://train.bizskilledu.com/logo.png -o "$tmp/live-logo"
          target=''
          for dir in '/' '/public_html/' '/domains/train.bizskilledu.com/public_html/'; do
            if curl "${opts[@]}" "$base${dir}logo.png" -o "$tmp/remote-logo" && cmp -s "$tmp/live-logo" "$tmp/remote-logo" && curl "${opts[@]}" "$base${dir}index.html" -o "$tmp/remote-index" && grep -qi 'BizSkill' "$tmp/remote-index" && curl "${opts[@]}" "$base${dir}api.php" -o "$tmp/remote-api" && grep -q 'BizSkill Training' "$tmp/remote-api"; then
              target="$dir"
              break
            fi
          done
          test -n "$target" || { echo 'Could not verify the training site directory; no files uploaded.'; exit 1; }
          echo "Verified training application directory: $target"
          for file in index.html api.php logo.png; do
            curl "${opts[@]}" --upload-file "$file" "$base$target$file"
          done
