<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e86826">
<title>BizSkill Training</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
:root{--bg:#F7F5F0;--card:#fff;--ink:#1E1E22;--mut:#5F5F68;--line:#E6E1D6;--or:#C2470F;--orl:#FDF1EA;--gr:#0B7A5E;--grl:#D9F2E8;--rd:#B3261E;--rdl:#FADCD9;--yl:#FDE7C7;--hd:'Space Grotesk',Inter,system-ui,sans-serif;--sh:0 1px 2px rgba(30,30,34,.05)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
img.lg{border:1px solid var(--ink);border-radius:3px;flex:none}
.logo{font-family:var(--hd);font-weight:700;letter-spacing:.2px}
.grow{flex:1;min-width:0}.sub{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:#EFEBE2;border-radius:12px;padding:4px;margin:12px 0}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:9px;font-weight:600;color:var(--mut);cursor:pointer}
.seg.four button{font-size:13px;padding:10px 2px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

p{margin:6px 0}.mut{color:var(--mut)}.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;box-shadow:var(--sh)}
.card.tap{cursor:pointer}.card.tap:hover{border-color:#CFC8B8}.card.tap:active{background:#F6F3EC}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.btn{color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid #D5CFC2;background:#fff;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{border-color:#B9B2A2}.btn.pri{background:var(--or);border-color:var(--or);color:#fff}.btn.pri:hover{background:#A83C0B;border-color:#A83C0B}

.btn.wide{width:100%}.btn.danger{color:var(--rd)}.btn[disabled]{opacity:.5}

.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh);display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile .n{font-family:var(--hd);font-size:26px;font-weight:700;line-height:1.1}.tile .n span{font-size:14px;font-weight:600;color:var(--mut)}.tile .l{font-size:12px;color:var(--mut);margin-top:3px;font-weight:500}
.tile .ring{flex:none}
.bar{height:10px;background:#EEE9DF;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--or);border-radius:6px}
.bar.ok i{background:var(--gr)}.bar.bad i{background:var(--rd)}
.tag{white-space:nowrap;display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:#EEE9DF;color:#4A4A52}
.tag.ok{background:var(--grl);color:#0A6B52}.tag.bad{background:var(--rdl);color:#A1211A}.tag.or{background:var(--yl);color:#7A4300}
.banner{background:var(--yl);border-radius:16px;padding:16px;margin:12px 0}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=tel],input[type=password],input[type=date],input[type=number],select{width:100%;min-height:46px;padding:0 12px;border:1px solid #CFC9BC;border-radius:10px;background:#fff}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.err{background:var(--rdl);color:#A1211A;padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(20,20,24,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px 28px}
.stats{display:flex;gap:14px;font-size:13px;color:var(--mut);margin-top:8px;flex-wrap:wrap}.stats b{color:var(--ink)}
.lesson{display:flex;gap:12px;align-items:center}.num{width:34px;height:34px;border-radius:50%;background:#EEE9DF;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.num.done{background:var(--gr);color:#fff}.num.open{background:var(--or);color:#fff}
.player{position:relative;margin:12px auto;width:100%;max-width:min(100%,calc(62vh*9/16));aspect-ratio:9/16;background:#111;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(30,30,34,.18)}

.player iframe,.player #yt{position:absolute;inset:0;width:100%;height:100%;border:0}

.player .cover.playing span{display:none}
.pbar{height:8px;background:#E6E1D6;border-radius:6px;overflow:hidden;margin:10px 0 8px}.pbar i{display:block;height:100%;background:var(--or);width:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:13px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff;cursor:pointer}
.opt input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--or)}.opt.right{border-color:var(--gr);background:var(--grl)}.opt.wrong{border-color:var(--rd);background:var(--rdl)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{background:none;border:0;color:var(--or);font-weight:700;padding:6px 0;cursor:pointer;text-decoration:underline}
.hero{background:var(--ink);color:#fff;border-radius:20px;padding:24px 20px;margin:16px 0}.hero h1{margin-top:0}.hero .mut{color:#C9C6BF}
.preview{background:var(--orl);color:#7A3208;font-size:13px;font-weight:600;padding:9px 12px;border-radius:10px;margin:10px 0}
details.card summary{cursor:pointer;font-weight:700;list-style:none}details.card summary::-webkit-details-marker{display:none}
.pw{position:relative}.pw input{padding-right:50px}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px}.eye:hover{color:var(--ink)}
.authbox{max-width:420px;margin:0 auto;padding-top:7vh}.authbrand{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:20px}.authbrand img{border:1px solid var(--ink);border-radius:5px}.authbrand b{font-family:var(--hd);font-size:26px;white-space:nowrap}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:14px 0}.phead h1{margin:2px 0}
.cols{display:flex;flex-wrap:wrap;gap:0 20px;align-items:flex-start}.colmain{flex:3 1 560px;min-width:0}.colside{flex:1 1 280px;min-width:0}
.attn{display:flex;gap:10px;font-size:14px;margin-top:10px}.attn i{width:10px;height:10px;border-radius:50%;background:#9A9AA3;margin-top:5px;flex:none}.attn i.bad{background:var(--rd)}
.stf{width:100%;border-collapse:collapse;display:block}.stf thead{display:none}.stf tbody{display:block}
.stf tr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0;box-shadow:var(--sh);cursor:pointer}
.stf tr.off{opacity:.6}.stf td{padding:0;font-size:13px;color:var(--mut)}.stf td b{color:var(--ink)}
.stf td.nm{flex:1 1 55%;font-size:16px}.stf td.pr{flex:1 1 100%}.stf td[data-l]::before{content:attr(data-l) " ";}
.cgrid{display:grid;grid-template-columns:1fr;gap:0 14px}
.lcols{display:block}.lside .card:first-child{margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;font-weight:600;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.skel{height:84px;border-radius:16px;margin:12px 0;background:linear-gradient(90deg,#EEE9DF 25%,#F6F3EC 50%,#EEE9DF 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}}
.cgrid3{display:grid;grid-template-columns:1fr;gap:0 16px}.ccard{padding:20px}.ccard .open{margin-top:14px;font-weight:700;color:var(--or);font-size:14px}.ccard:hover .open{text-decoration:underline}
.lrow{display:flex;gap:16px;align-items:flex-start}.lthumb{flex:none;width:104px;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#1E1E22;position:relative}
.lthumb img,.lthumb iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.lthumb button{position:absolute;inset:0;border:0;background:rgba(30,30,34,.18);cursor:pointer;display:flex;align-items:center;justify-content:center}.lthumb button span{width:44px;height:44px;border-radius:50%;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;padding-left:3px}
.lthumb.empty{background:#EEE9DF;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:600;color:var(--mut);padding:8px}
@media(min-width:700px){.lthumb{width:168px}}
.trings{display:flex;gap:12px 14px;flex-wrap:wrap;margin:14px 0 10px}.trings>div{display:flex;align-items:center;gap:10px;flex:1 1 150px}.trings b{display:block;font-size:15px}.trings span{font-size:12px;color:var(--mut)}
.tchk{display:flex;align-items:center;gap:8px;font-size:14px;margin:7px 0}.tchk>span:first-child{width:20px;height:20px;border-radius:50%;border:2px solid #CFC9BC;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}.tchk>span.y{background:var(--gr);border-color:var(--gr);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.chead{padding:22px}.lcard{padding:18px}.ans{background:var(--grl);color:#0A6B52;font-size:13px;font-weight:600;padding:4px 10px;border-radius:10px}
.qrow{border-top:1px solid #EEE9DF;padding-top:10px;margin-top:10px;font-size:14px}
@media(min-width:700px){.cgrid3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}}
#side{display:none}
@media(min-width:560px){h1{font-size:28px}.cgrid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}}
@media(min-width:1000px){
#shell{display:flex;min-height:100vh}
#side:not([hidden]){display:flex;flex-direction:column;gap:4px;width:248px;flex:none;padding:24px 16px;background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100vh}
#side .brand{display:flex;align-items:center;gap:10px;padding:0 6px 22px}#side .brand img{border:1px solid var(--ink);border-radius:4px}
#side .brand b{font-family:var(--hd);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#side nav{display:flex;flex-direction:column;gap:4px}
#side nav button{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;border:0;background:none;color:#3A3A40;font-size:15px;font-weight:500;cursor:pointer;text-align:left}
#side nav button:hover{background:#F6F3EC}#side nav button.on{background:var(--orl);color:#A83C0B;font-weight:600}
#side .who{margin-top:auto;background:#F3F1EC;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
#side .acct{display:flex;align-items:center;gap:10px}
#side .av{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;letter-spacing:.5px}
#side .acct b{display:block;font-size:14px;color:var(--ink);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#side .out{color:var(--rd);min-height:44px;gap:8px;font-weight:600}
#mainwrap{flex:1;min-width:0}
body:not(.auth) header.top,body:not(.auth) .navseg{display:none}
body:not(.auth) .wrap{max-width:1280px;margin:0;padding:22px 32px 64px}
body.auth .wrap{max-width:1100px}
.tiles{grid-template-columns:repeat(4,1fr);gap:16px}.tiles.t3{grid-template-columns:repeat(3,1fr)}
.tile{padding:18px 20px}.tile .n{font-size:32px}.tile .l{font-size:13px}
.stf{display:table;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);border-spacing:0;border-collapse:separate;overflow:hidden}
.stf thead{display:table-header-group}.stf tbody{display:table-row-group}
.stf th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:600;padding:14px 12px}.stf th:first-child,.stf td:first-child{padding-left:20px}
.stf tr{display:table-row;border:0;border-radius:0;box-shadow:none;margin:0;padding:0;background:none}.stf tbody tr:hover{background:#FBFAF6}
.stf td{display:table-cell;padding:15px 12px;font-size:14px;color:var(--ink);border-top:1px solid #EEE9DF;vertical-align:middle}.stf td.nm{font-size:15px;white-space:nowrap}.stf td.pr{width:26%}
.stf td[data-l]::before{content:none}.stf td.dim{color:var(--mut)}
.sheet{align-items:center}.sheet .box{border-radius:20px;max-width:560px}
.authcols{display:flex;gap:40px;align-items:center;max-width:1040px;margin:0 auto;min-height:92vh}.authcols .hero{flex:1 1 0;margin:0;padding:48px 40px}.authcols .hero h1{font-size:40px}.authform{flex:0 0 400px}
.lcols{display:flex;gap:28px;align-items:flex-start}.lvid{flex:0 0 300px}.lvid .player{margin-top:0;max-width:300px}.lside{flex:1;min-width:0}.lside .card:first-child,.lside h2:first-child{margin-top:0}
}
/* Thumbnail-led course catalogue */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,245px),1fr));gap:18px;align-items:stretch}
.course-grid .course-card{margin:0;display:flex;flex-direction:column;padding:0;overflow:hidden;border-radius:14px;transition:box-shadow .18s,transform .18s}
.course-grid .course-card:hover{box-shadow:0 8px 24px #231b1218;transform:translateY(-2px)}
.course-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.course-body h2{font-size:18px;margin:0;line-height:1.3}.course-body .open{margin-top:auto;padding-top:8px;color:var(--or);font-weight:700}
.course-cover{position:relative;aspect-ratio:16/9;overflow:hidden;background:linear-gradient(125deg,#192c48,#354e79 65%,#b84c1e);color:#fff;display:flex;align-items:center;justify-content:center;padding:14px}
.course-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.course-cover .fallback{position:relative;width:100%;display:flex;flex-direction:column;gap:8px;justify-content:center;font-size:clamp(16px,2vw,24px);font-weight:800;line-height:1.2}.course-cover .fallback small{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#f4d7ad}.course-cover:has(img) .fallback{visibility:hidden}
.course-tools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}.course-tools input{flex:2;min-width:160px;margin:0}.course-tools select{flex:1;min-width:135px;margin:0}.course-tools button{white-space:nowrap}
.course-hero{display:grid;grid-template-columns:minmax(180px,280px) 1fr;gap:20px;align-items:center;margin-bottom:18px}.course-hero .course-cover{border-radius:10px}.course-hero h1{margin:0 0 8px}
.course-upload{margin:8px 0 14px}.course-upload .course-cover{max-width:360px;border-radius:10px;margin-bottom:8px}.course-upload input{max-width:100%}
.owner-catalogue .course-grid{grid-template-columns:1fr}.owner-catalogue .course-cover{aspect-ratio:16/9}.course-card[hidden]{display:none!important}
@media(min-width:1250px){.course-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.owner-catalogue .course-grid{grid-template-columns:1fr}}
@media(max-width:600px){.course-grid{grid-template-columns:1fr}.course-hero{grid-template-columns:1fr}.course-tools input,.course-tools select{flex-basis:100%}}
input.course-order::-webkit-inner-spin-button,input.course-order::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input.course-order{appearance:textfield;-moz-appearance:textfield}

<body>
<div id="shell">
<aside id="side" hidden></aside>
<div id="mainwrap">
<header class="top" id="top" hidden><div class="in"><img class="lg" src="logo.png" alt="BizSkill" width="46" height="32"><div class="grow"><div class="logo">BizSkill Training</div><div class="sub" id="topsub"></div></div><button class="btn sm" id="menuBtn">Menu</button></div></header>
<main class="wrap" id="app"></main>
</div>
</div>
<div id="sheets"></div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ME = null, VIEW = localStorage.getItem('bzview') || 'owner', beatTimer = null, loopTimer = null, player = null;
async function api(a, body = {}) {
  let r, j;
  try { r = await fetch('api.php?a=' + a, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-App': '1'}, credentials: 'same-origin', body: JSON.stringify(body)}); j = await r.json(); }
  catch (e) { throw new Error('Could not reach the server. Check your internet and try again.'); }
  if (!r.ok) { const er = new Error(j.error || 'Something went wrong.'); er.code = r.status; throw er; }
  return j;
}
const fmtDate = t => t ? new Date(t * 1000).toLocaleDateString('en-IN', {day: 'numeric', month: 'short', year: 'numeric'}) : '';
const ago = t => { if (!t) return 'Never'; const d = Math.floor(Date.now() / 1000) - t; if (d < 3600) return 'Just now'; if (d < 86400) return Math.floor(d / 3600) + ' h ago'; if (d < 86400 * 30) return Math.floor(d / 86400) + ' d ago'; return fmtDate(t); };
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const wt = s => !s.seconds ? '0 min' : s.seconds < 60 ? 'under 1 min' : Math.round(s.seconds / 60) + ' min';
const ring = (p, col) => `<svg class="ring" role="img" aria-label="${p} percent" width="56" height="56" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="#EEE9DF" stroke-width="8"/>${p > 0 ? `<circle cx="32" cy="32" r="26" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(163.4 * Math.min(100, p) / 100).toFixed(1)} 163.4" transform="rotate(-90 32 32)"/>` : ''}</svg>`;
const thumb = (id, title) => `<img src="https://i.ytimg.com/vi/${esc(id)}/hqdefault.jpg" alt="" loading="lazy"><button aria-label="Play ${esc(title || 'video')}"><span aria-hidden="true">▶</span></button>`;

const cover = c => `<div class="course-cover"><div class="fallback"><small>BizSkill · Training</small><span>${esc(c.title || 'Course thumbnail')}</span></div>${/^[a-f0-9]{32}\.jpg$/.test(c.thumbnail || '') ? `<img src="uploads/courses/${esc(c.thumbnail)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</div>`;
const courseAttr = c => `data-filter-course data-search="${esc([c.title,c.descr,c.category].join(' ').toLowerCase())}" data-cat="${+c.category_id||0}"`;
function courseTools(courses, categories) {
  const cats = categories || [...new Map(courses.filter(c=>c.category_id).map(c=>[+c.category_id,{id:c.category_id,name:c.category}])).values()];
  return `<div class="course-tools"><input type="search" aria-label="Search courses" placeholder="Search courses..." data-course-search><select aria-label="Filter courses by category" data-course-category><option value="">All categories</option>${cats.map(c=>`<option value="${+c.id}">${esc(c.name)}</option>`).join('')}</select></div><p class="mut" data-course-empty hidden>No matching courses.</p>`;
}
function bindCourseTools(root=document) {
  const search=$('[data-course-search]',root), cat=$('[data-course-category]',root), empty=$('[data-course-empty]',root); if(!search||!cat)return;
  const filter=()=>{let count=0;root.querySelectorAll('[data-filter-course]').forEach(el=>{el.hidden=!(el.dataset.search.includes(search.value.trim().toLowerCase()) && (!cat.value||el.dataset.cat===cat.value));if(!el.hidden)count++;});if(empty)empty.hidden=count>0;};

async function resizeCourseImage(file) {
  if(!file || !['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>15*1024*1024)throw Error('Choose a JPG, PNG or WebP image under 15 MB.');
  const url=URL.createObjectURL(file);
  try {
    const im=new Image();im.src=url;await im.decode();
    const cv=document.createElement('canvas');cv.width=1280;cv.height=720;
    const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,1280,720);
    const scale=Math.max(1280/im.width,720/im.height),w=im.width*scale,h=im.height*scale;
    cx.drawImage(im,(1280-w)/2,(720-h)/2,w,h);
    return cv.toDataURL('image/jpeg',.84);
  } finally {URL.revokeObjectURL(url);}
}

          <div class="bar ${n && v === n ? 'ok' : ''}" style="margin-top:14px"><i style="width:${pct(v, n)}%"></i></div>
          <div class="stats"><span><b>${n}</b> lesson${n == 1 ? '' : 's'}</span><span><b>${v}</b> with video</span><span>${c.lessons.reduce((a,l)=>a+l.questions.length,0)} MCQs</span></div>
          <div class="open">Open course <span aria-hidden="true">›</span></div></div></div>`; }).join('') || '<div class="card"><b>No courses yet</b><p class="mut sm">Tap New course to create your first one.</p></div>'}</div>`;
    } else {
      const c = sel, v = c.lessons.filter(l => l.yt).length, nq = c.lessons.reduce((a, l) => a + l.questions.length, 0);
      $('#app').innerHTML = seg + `<button class="link" id="backc">‹ All courses</button>
        <div class="card chead"><div class="course-hero">${cover(c)}<div><div class="row between" style="align-items:flex-start;flex-wrap:wrap"><div class="grow"><h1 style="margin:0 0 4px">${esc(c.title)}</h1><div class="mut">${esc(c.descr)}</div></div><span>${tags(c)}</span></div><div class="mut sm">${esc(c.category||'')}</div></div></div>
          <div class="stats" style="margin-top:12px;font-size:14px"><span><b>${c.lessons.length}</b> lesson${c.lessons.length == 1 ? '' : 's'}</span><span><b>${v}</b> with video</span><span><b>${nq}</b> test questions</span><span>${+c.is_free ? 'Open on the free plan' : 'Yearly plan only'}</span></div>
          <div class="row" style="margin-top:16px;flex-wrap:wrap"><button class="btn sm pri" data-nl="${c.id}">Add lesson</button><button class="btn sm" data-ec="${c.id}">Edit course</button><button class="btn sm danger" data-del="course:${c.id}">Delete course</button></div></div>
        <h2>Lessons</h2>
        ${c.lessons.map((l, i) => `<div class="card lcard"><div class="lrow">${l.yt ? `<div class="lthumb" data-yt="${esc(l.yt)}">${thumb(l.yt, l.title)}</div>` : '<div class="lthumb empty">No video yet</div>'}<div class="lesson grow" style="align-items:flex-start"><div class="num ${l.yt ? 'done' : ''}">${i + 1}</div><div class="grow">
          <div class="row between" style="align-items:flex-start"><b style="font-size:16px">${esc(l.title)}</b><span class="tag ${l.yt ? 'ok' : 'bad'}">${l.yt ? 'Video set' : 'No video'}</span></div>
          <div class="mut sm">${l.yt ? 'YouTube ID ' + esc(l.yt) + (+l.duration ? ' · ' + l.duration + ' s' : ' · length is read on first play') : 'Paste the unlisted YouTube link with Edit lesson.'} · ${l.questions.length} question${l.questions.length == 1 ? '' : 's'}</div>
          ${l.questions.map((q, k) => `<div class="qrow"><div><b>Q${k + 1}.</b> ${esc(q.q)}</div><div class="row" style="flex-wrap:wrap;margin-top:4px"><span class="ans">${esc([q.a, q.b, q.c, q.d][q.correct])}</span><button class="link sm" data-eq="${q.id}" data-lid="${l.id}">Edit</button><button class="link sm" data-del="question:${q.id}">Delete</button></div></div>`).join('')}
          <div class="row" style="margin-top:14px;flex-wrap:wrap">${l.yt ? `<button class="btn sm pri" data-pv="${l.id}">Preview</button>` : ''}<button class="btn sm" data-el="${l.id}">Edit lesson</button><button class="btn sm" data-nq="${l.id}">Add question</button><button class="btn sm danger" data-del="lesson:${l.id}">Delete</button></div>
        </div></div></div></div>`).join('') || '<div class="card"><b>No lessons yet</b><p class="mut sm">Tap Add lesson, give it a title, and paste the unlisted YouTube link.</p></div>'}`;
      $('#backc').onclick = () => { ACOURSE = 0; viewAdmin(); };
      // Small video on the left of each lesson: a still picture until tapped, then it plays in place. Only one plays at a time.
      const bindThumbs = () => document.querySelectorAll('.lthumb[data-yt] button').forEach(b => b.onclick = () => { const t = b.parentElement;
        document.querySelectorAll('.lthumb[data-yt]').forEach(o => { if (o !== t && o.querySelector('iframe')) o.innerHTML = thumb(o.dataset.yt, ''); });
        t.innerHTML = `<iframe src="https://www.youtube.com/embed/${esc(t.dataset.yt)}?autoplay=1&playsinline=1&rel=0" title="Lesson video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`; bindThumbs(); });
      bindThumbs();
    }
    const all = d.courses, L = id => all.flatMap(c => c.lessons).find(l => l.id == id), Q = id => all.flatMap(c => c.lessons).flatMap(l => l.questions).find(q => q.id == id);

    const cf = (c = {}) => formSheet(c.id ? 'Edit course' : 'New course', [{name:'title',label:'Course title *',required:true,value:c.title},{name:'descr',label:'One-line description *',required:true,value:c.descr},{name:'category_id',label:'Category *',type:'select',required:true,value:(d.categories||[]).some(x=>+x.active&&+x.id===+c.category_id)?c.category_id:'',options:[['','Select category'],...(d.categories||[]).filter(x=>+x.active).map(x=>[x.id,x.name])]},{name:'sort',label:'Order (1 = first)',type:'number',attrs:'class="course-order" step="1"',value:c.sort??all.length+1},{name:'is_free',label:'Free course',type:'check',value:+c.is_free},{name:'published',label:'Live (visible to businesses)',type:'check',value:c.id?+c.published:1}], 'Save', async (v,close,el)=>{
      const file=$('[data-course-file]',el).files[0];if(file)v.thumbnail_data=await resizeCourseImage(file);
      v.remove_thumbnail=$('[data-remove-thumb]',el).checked?1:0;await api('a_course_save',{...v,id:c.id||0});close();viewAdmin();
    }, `<div class="course-upload"><label>Course thumbnail</label><div data-preview>${cover(c)}</div><input type="file" data-course-file accept="image/jpeg,image/png,image/webp"><p class="mut sm">JPG, PNG or WebP. Cropped and compressed to 1280 × 720.</p><label class="row"><input type="checkbox" data-remove-thumb style="width:18px;height:18px"> Remove current thumbnail</label></div>`);
    function bindUpload(){const el=document.querySelector('.sheet:last-child');if(!el)return;const f=$('[data-course-file]',el);if(!f)return;const preview=$('[data-preview]',el);f.onchange=async()=>{try{if(!f.files[0])return;const data=await resizeCourseImage(f.files[0]);preview.innerHTML='<div class="course-cover"><img alt="Thumbnail preview" src="'+data+'"></div>';$('[data-remove-thumb]',el).checked=false;}catch(e){toast(e.message);f.value='';}};}
    const openCF=c=>{cf(c);bindUpload();};
    function categories(){sheet(`<div class="row between"><h2>Course Categories</h2><button class="btn x">Close</button></div><div id="catlist">${(d.categories||[]).map(c=>`<div class="card row between"><b>${esc(c.name)}</b><span class="tag">${+c.active?'Active':'Inactive'}</span><button class="btn sm" data-editcat="${c.id}">Edit</button></div>`).join('')||'<p class="mut">No categories yet.</p>'}</div><button class="btn pri wide" id="newcat">New category</button>`,(el,close)=>{
      $('.x',el).onclick=close;const edit=(c={})=>{close();formSheet(c.id?'Edit category':'New category',[{name:'name',label:'Category name',value:c.name},{name:'active',label:'Active',type:'check',value:c.id?+c.active:1}],'Save',async(v,cl)=>{await api('a_category_save',{...v,id:c.id||0});cl();await viewAdmin();});};
      $('#newcat',el).onclick=()=>edit();el.querySelectorAll('[data-editcat]').forEach(b=>b.onclick=()=>edit(d.categories.find(c=>+c.id===+b.dataset.editcat)));
    });}
    if ($('#cats')) $('#cats').onclick=categories;
    bindCourseTools();
    const lf = (l = {}, cid) => formSheet(l.id ? 'Edit lesson' : 'Add lesson', [{name: 'title', label: 'Lesson title', value: l.title}, {name: 'yt', label: 'YouTube link (unlisted)', value: l.yt, hint: 'Paste the video or Shorts link. Leave blank to add it later.'}, {name: 'sort', label: 'Order (1 = first)', type: 'number', value: l.sort ?? ((all.find(c => c.id == cid) || {lessons: []}).lessons.length + 1)}], 'Save', async (v, close) => { await api('a_lesson_save', {...v, id: l.id || 0, course_id: cid, duration: +l.duration || 0}); close(); viewAdmin(); });
    const qf = (q = {}, lid) => formSheet(q.id ? 'Edit question' : 'Add question', [{name: 'q', label: 'Question', value: q.q}, {name: 'a', label: 'Option 1', value: q.a}, {name: 'b', label: 'Option 2', value: q.b}, {name: 'c', label: 'Option 3 (optional)', value: q.c}, {name: 'd', label: 'Option 4 (optional)', value: q.d}, {name: 'correct', label: 'Correct option', type: 'select', value: q.correct ?? 0, options: [[0, 'Option 1'], [1, 'Option 2'], [2, 'Option 3'], [3, 'Option 4']]}], 'Save', async (v, close) => { await api('a_question_save', {...v, correct: +v.correct, id: q.id || 0, lesson_id: lid}); close(); viewAdmin(); });
    if ($('#nc')) $('#nc').onclick = () => openCF({});
    document.querySelectorAll('[data-sc]').forEach(b => { b.onclick = () => { ACOURSE = +b.dataset.sc; viewAdmin(); window.scrollTo(0, 0); }; b.onkeydown = e => { if (e.key === 'Enter') b.onclick(); }; });
    document.querySelectorAll('[data-ec]').forEach(b => b.onclick = () => openCF(all.find(c => c.id == b.dataset.ec)));
    document.querySelectorAll('[data-nl]').forEach(b => b.onclick = () => lf({}, +b.dataset.nl));
    document.querySelectorAll('[data-el]').forEach(b => b.onclick = () => lf(L(b.dataset.el), 0));
    document.querySelectorAll('[data-nq]').forEach(b => b.onclick = () => qf({}, +b.dataset.nq));
    document.querySelectorAll('[data-pv]').forEach(b => b.onclick = () => { const l = L(b.dataset.pv);
      sheet(`<div class="row between"><h2 style="margin:4px 0;font-size:16px">${esc(l.title)}</h2><button class="btn sm x">Close</button></div>
        <div class="player"><iframe src="https://www.youtube.com/embed/${esc(l.yt)}?playsinline=1&rel=0" title="Lesson video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
        <p class="mut sm">Admin preview. This is the video your customers' employees will see. Watching here is not tracked.</p>
        <h2>Test after this lesson</h2>${l.questions.map((q, i) => `<div class="card"><b>${i + 1}. ${esc(q.q)}</b>${[q.a, q.b, q.c, q.d].map((o, n) => o ? `<div class="opt ${n == q.correct ? 'right' : ''}" style="cursor:default"><span>${esc(o)}${n == q.correct ? ' (correct)' : ''}</span></div>` : '').join('')}</div>`).join('') || '<p class="mut">No questions yet.</p>'}`,
        (d, close) => { $('.x', d).onclick = close; }); });
    document.querySelectorAll('[data-eq]').forEach(b => b.onclick = () => qf(Q(b.dataset.eq), +b.dataset.lid));
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = function () { if (!this.dataset.sure) { this.dataset.sure = 1; this.textContent = 'Tap again to delete'; return; } const [what, id] = this.dataset.del.split(':'); api('a_delete', {what, id: +id}).then(() => { if (what === 'course') ACOURSE = 0; toast('Deleted'); viewAdmin(); }).catch(e => sheet(`<div class="err">${esc(e.message)}</div>`)); });
  }
  bindAdminSeg();
}

// ---------- router ----------
async function route() {
  stopPlayer(); $('#sheets').innerHTML = ''; window.scrollTo(0, 0); if (!$('#app').children.length) $('#app').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  try {
    if (!ME) ME = await api('me');
    const h = location.hash || '#/';
    if (h.startsWith('#/setup')) return viewSetup();
    if (!ME.user) return viewAuth(h === '#/start' ? 'signup' : 'login');
    const m = h.match(/^#\/(course|lesson)\/(\d+)/);
    if (m) return await (m[1] === 'course' ? viewCourse(+m[2]) : viewLesson(+m[2]));
    if (ME.user.role === 'admin') return await viewAdmin();
    if (ME.user.role === 'owner' && VIEW === 'profile') return viewProfile();
    if (ME.user.role === 'owner' && VIEW === 'owner') return await viewOwner();
    return await viewLearn();
  } catch (e) {
    if (e.code === 401) { ME = null; try { ME = await api('me'); } catch (x) {} if (ME) return viewAuth(); }
    $('#app').innerHTML = `<div class="err" style="margin-top:20px">${esc(e.message)}</div><button class="btn" onclick="location.hash='#/';location.reload()">Go to start</button>`;
  }
}
window.addEventListener('hashchange', route); route();
</script>
